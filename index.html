<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RandScan - RandProtocol Blockchain Explorer</title>
    <meta name="description" content="Explore the RandProtocol blockchain - blocks, transactions, validators, and more">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            750: '#2d3748',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom styles -->
    <style>
        body {
            background-color: #111827;
            color: #f9fafb;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Loading state -->
        <div class="flex items-center justify-center min-h-screen">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500 mx-auto mb-4"></div>
                <p class="text-gray-400">Loading RandScan...</p>
            </div>
        </div>
    </div>

    <!-- WASM Module -->
    <script type="module">
        import init from './pkg/randscan_frontend.js';
        init();
    </script>
</body>
</html>
