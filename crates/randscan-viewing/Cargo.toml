[package]
name = "randscan-viewing"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Opens shielded-chain envelopes with a viewing key or a per-transaction key, in the browser (WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The exact versions the fullnode's vendored zkVM (crates/shrugg-zkvm, commit 01dc23d) pins:
# the Poseidon2 round constants are drawn from a seeded rand StdRng, so both the field/hash
# crates and the RNG must match bit for bit.
p3-goldilocks = "=0.7.0"
p3-poseidon2 = "=0.7.0"
p3-field = "=0.7.0"
p3-symmetric = "=0.7.0"
rand = { version = "=0.10.2", features = ["std_rng"] }
ml-kem = "=0.3.2"
chacha20poly1305 = "=0.11.0"
bs58 = "0.5"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
# Nothing here draws randomness, but the AEAD/cipher crates link getrandom; in the browser it
# resolves to crypto.getRandomValues (see .cargo/config.toml for the backend cfg).
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
