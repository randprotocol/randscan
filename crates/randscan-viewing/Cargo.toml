[package]
name = "randscan-viewing"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Opens shielded-chain envelopes with a viewing key or a per-transaction key, in the browser (WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The exact versions the fullnode's vendored zkVM (crates/randprotocol-zkvm, commit e2aae20) pins.
# The Poseidon2 round constants are circuits' committed table (../randscan-core/src/
# poseidon2_constants.rs by #[path], audit ZKV-2), no longer a seeded rand StdRng draw; rand is a
# dev-dependency only, for the table's test that re-runs the old draw.
p3-goldilocks = "=0.7.0"
p3-poseidon2 = "=0.7.0"
p3-field = "=0.7.0"
p3-symmetric = "=0.7.0"
ml-kem = "=0.3.2"
chacha20poly1305 = "=0.11.0"
bs58 = "0.5"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
# Nothing here draws randomness, but the AEAD/cipher crates link getrandom; in the browser it
# resolves to crypto.getRandomValues (see .cargo/config.toml for the backend cfg).
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
rand = { version = "=0.10.2", features = ["std_rng"] }

[profile.release]
opt-level = "s"
lto = true
