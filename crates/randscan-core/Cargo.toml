[package]
name = "randscan-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# Chain 14 (the hidden-asset bundle): a native (non-wasm) Poseidon2 note-commitment hash, so the
# indexer can recompute the ONE commitment a `token_mint` / a `register_token` initial mint does
# not publish directly (unlike a `bridge_attest`'s deposit, whose `commitment` field the node
# already serves) and link that leaf to its transaction. Pinned to the *exact* versions
# `crates/randscan-viewing` uses (fullnode's vendored zkVM, checked at d40fb94 = v0.6.6, chain 18; unchanged at 86941a1 = v0.6.7, chains 18 and 19). The Poseidon2 round
# constants are circuits' committed table (`src/poseidon2_constants.rs`, audit ZKV-2), no longer a
# seeded `rand` `StdRng` draw, so `rand` is only a dev-dependency now: the table's own test re-runs
# the old draw to prove the two equal. Deliberately not a dependency on `crates/randscan-viewing`
# itself, which is wasm32-only (`getrandom`'s `wasm_js` backend) and excluded from this workspace.
p3-goldilocks = "=0.7.0"
p3-poseidon2 = "=0.7.0"
p3-field = "=0.7.0"
p3-symmetric = "=0.7.0"
bs58 = "0.5"
hex = "0.4"
# A Tron address is base58check: the bridge page prints each trusted emitter the way its own
# chain's explorer does (`types/bridge.rs`, `emitter_address`).
sha2 = { workspace = true }

[dev-dependencies]
rand = { version = "=0.10.2", features = ["std_rng"] }
