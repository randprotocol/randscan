[workspace]
resolver = "2"
members = [
    "crates/randscan-core",
    "crates/randscan-db",
    "crates/randscan-indexer",
    "crates/randscan-api",
    "crates/randscan-ws",
    "crates/randscan-frontend",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RandProtocol Team"]
license = "MIT"
repository = "https://github.com/randprotocol/randscan"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }

# Frontend (Leptos)
leptos = { version = "0.6", features = ["csr"] }
leptos_router = "0.6"
leptos_meta = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "HtmlElement", "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent"] }
gloo-net = "0.5"
gloo-timers = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# WebSocket
tokio-tungstenite = "0.21"
futures-util = "0.3"

# Cryptography
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Configuration
config = "0.14"
dotenvy = "0.15"

# Internal crates
randscan-core = { path = "crates/randscan-core" }
randscan-db = { path = "crates/randscan-db" }
randscan-indexer = { path = "crates/randscan-indexer" }
randscan-api = { path = "crates/randscan-api" }
randscan-ws = { path = "crates/randscan-ws" }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
