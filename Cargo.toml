[workspace]
resolver = "2"
members = [
    "crates/randscan-core",
    "crates/randscan-db",
    "crates/randscan-indexer",
    "crates/randscan-api",
    "crates/randscan-ws",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["RandProtocol Team"]
license = "MIT"
repository = "https://github.com/randprotocol/randscan"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# WebSocket
futures-util = "0.3"

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4"] }

# Auth
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
axum-extra = { version = "0.9", features = ["cookie"] }
time = "0.3"

# Configuration
dotenvy = "0.15"

# Internal crates
randscan-core = { path = "crates/randscan-core" }
randscan-db = { path = "crates/randscan-db" }
randscan-indexer = { path = "crates/randscan-indexer" }
randscan-api = { path = "crates/randscan-api" }
randscan-ws = { path = "crates/randscan-ws" }

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
